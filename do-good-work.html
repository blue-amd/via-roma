    <!-- Google Fonts -->

    <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,400;0,500;0,700;1,400&family=Fraunces:opsz,wght@9..144,400;9..144,700&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--

                        src="images/brand-logo.png"

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link" href="index.html">

                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="index.html#about">
                                About

    <!-- Home page CSS -->
    <style>

        /* Body text size for the whole page content */
        main {
            font-size: 20px;
        }

        /* Light-blue text with a thin outline so it is readable on cream */
        .text-outline-shadow {
            color: var(--primary-color);
            text-shadow:
                -1px -1px 0 #778394,
                 1px -1px 0 #778394,
                -1px  1px 0 #778394,
                 1px  1px 0 #778394;
        }
    </style>

<!--Product Layout-->

      <section class="product-layout">
        <div class="gallery">
          <div class="thumbnail-list">
            <button class="thumbnail active" data-image="images/do-good-work-tee.jpg" aria-label="Front product view">
              <img src="images/do-good-work-tee.jpg" alt="Front view of Do Good Work Tee">
            </button>
            <button class="thumbnail" data-image="images/goodwork-back.png" aria-label="Back product view">
              <img src="images/goodwork-back.png" alt="Back view of Do Good Work Tee">
            </button>
          </div>

          <div class="main-image">
            <img id="mainProductImage" src="images/do-good-work-tee.jpg" alt="Do Good Work Tee">
          </div>
        </div>

        <div class="product-info">
          <div class="collection-label">NEW ARRIVAL</div>
          <h1 class="product-title">Do Good Work Tee</h1>
          <p class="product-price">₱499.00</p>
          <p class="product-description">Your everyday essential. A versatile tee designed for comfort and effortless styling.</p>

          <hr class="product-divider">

          <p class="size-label">Size: <strong id="selectedSize">(Size Name)</strong></p>
          <div class="size-options" aria-label="Choose a size">
            <button class="size-btn" data-size="S">S</button>
            <button class="size-btn" data-size="M">M</button>
            <button class="size-btn" data-size="L">L</button>
            <button class="size-btn" data-size="XL">XL</button>
          </div>

          <div class="quantity-row">
            <span>Quantity:</span>
              <button class="quantity-btn" id="increaseQuantity" aria-label="Increase quantity">+</button>
              <output class="quantity" id="quantity">1</output>
              <button class="quantity-btn" id="decreaseQuantity" aria-label="Decrease quantity">−</button>
          </div>

          <button class="buy-button" id="buyNow">Buy Now</button>
          <p id="statusMessage" class="status-message" role="status"></p>
        </div>
      </section>
    </main>
    <!-- 
        FOOTER
     -->

    <footer>

        <div class="container-fluid px-4 px-lg-5">

            <div class="footer-content">

                <!-- Footer brand -->
                <p class="footer-brand">
                    Via Roma © 2026
                </p>

                <!-- Link to current Privacy Policy page -->
                <a href="privacy.html" class="footer-link"
                   aria-current="page">
                    Privacy Policy
                </a>

            </div>

        </div>

    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Buy button functionality -->
    <script>

      const mainProductImage = document.getElementById('mainProductImage');
      const thumbnails = document.querySelectorAll('.thumbnail');

      thumbnails.forEach(thumbnail => {
        thumbnail.addEventListener('click', () => {
          // Update the main product image
          const thumbnailImage = thumbnail.querySelector('img');
          mainProductImage.src = thumbnailImage.src;

          // Update the active thumbnail
          thumbnails.forEach(t => t.classList.remove('active'));
          thumbnail.classList.add('active');
        });
      });

      const sizeButtons = document.querySelectorAll('.size-btn');
      const selectedSizeElement = document.getElementById('selectedSize');
      const sizeNames = {
        'S': 'Small',
        'M': 'Medium',
        'L': 'Large',
        'XL': 'Extra Large'
      };

      sizeButtons.forEach(button => {
        button.addEventListener('click', () => {
          // Update the selected size display
          const size = button.getAttribute('data-size');
          selectedSizeElement.textContent = sizeNames[size];

          // Update the active size button
          sizeButtons.forEach(btn => btn.classList.remove('active'));
          button.classList.add('active');
        });
      });

      const increaseBtn = document.getElementById('increaseQuantity');
      const decreaseBtn = document.getElementById('decreaseQuantity');
      const quantityOutput = document.getElementById('quantity');

      if (increaseBtn && decreaseBtn && quantityOutput) {
        increaseBtn.addEventListener('click', () => {
          let currentQuantity = parseInt(quantityOutput.value);
          quantityOutput.value = currentQuantity + 1;
        });

        decreaseBtn.addEventListener('click', () => {
          let currentQuantity = parseInt(quantityOutput.value);
          if (currentQuantity > 1) {
            quantityOutput.value = currentQuantity - 1;
          }
        });
      }

      const buyNowButton = document.getElementById('buyNow');
      const statusMessage = document.getElementById('statusMessage');

      if (buyNowButton && statusMessage) {
        buyNowButton.addEventListener('click', () => {
          const productTitle = document.querySelector('.product-title').textContent;
          const productPrice = document.querySelector('.product-price').textContent;
          const selectedSize = selectedSizeElement.textContent;
          const quantity = quantityOutput.value;
          const numericalPrice = parseFloat(productPrice.replace('₱', '').replace(',', ''));

          const subject = `Order: ${productTitle} - ₱${numericalPrice.toFixed(2)} - Size: ${selectedSize} - Quantity: ${quantity}`;
          const body = `Hello Via Roma,\n\nI would like to place an order for the following item:\n\nProduct: ${productTitle}\nPrice: ${productPrice}\nSize: ${selectedSize}\nQuantity: ${quantity}\n\nThank you!`;

          const mailtoLink = `mailto:orders@examplewebsite142.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
          window.location.href = mailtoLink;
        });
      }
    </script>

</body>
</html>

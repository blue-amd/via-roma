
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Do Good Work Tee | VIA ROMA</title>

    <link rel="icon" type="image/png" href="images/Shop.png">

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,400;0,500;0,700;1,400;1,700&family=Fraunces:opsz,wght@9..144,400;9..144,700&display=swap" rel="stylesheet">

   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    
    <link rel="stylesheet" href="css/product.css">

</head>


<body>

    <!-- HEADER -->

    <header class="product-header">

        <!-- LOGO: Change image path if needed -->
        <a href="index.html" class="product-brand">

            <img src="images/brand-logo.png"
                 alt="VIA ROMA logo">

            <span>VIA ROMA</span>

        </a>


        <!-- NAVIGATION LINKS -->
        <nav class="product-nav" aria-label="Main navigation">

            <a href="index.html">Home</a>

            <a href="index.html#about">About</a>

            <a href="index.html#shop">Shop</a>

            <a href="contact.html">Contact</a>

        </nav>

    </header>



    <!-- PRODUCT INFORMATION AND GALLERY -->

    <main class="product-main">

        <div class="product-container">

            <section class="product-layout">


                <!-- PRODUCT IMAGE GALLERY -->
                <div class="gallery">

                    <!-- THUMBNAILS -->
                    <div class="thumbnail-list">

                        <!-- MAIN PRODUCT IMAGE -->
                        <button class="thumbnail active"
                                type="button"
                                data-image="images/do-good-work-tee.jpg"
                                aria-label="View front of shirt">

                            <img src="images/do-good-work-tee.jpg"
                                 alt="Do Good Work Tee front view">

                        </button>



                        <button class="thumbnail"
                                type="button"
                                data-image="images/do-good-work-tee.jpg"
                                aria-label="View alternate shirt image">

                            <img src="images/do-good-work-tee.jpg"
                                 alt="Do Good Work Tee alternate view">

                        </button>

                    </div>


                    <!-- MAIN DISPLAY IMAGE -->
                    <div class="main-image">

                        <img id="mainProductImage"
                             src="images/do-good-work-tee.jpg"
                             alt="Do Good Work Tee">

                    </div>

                </div>



                <!-- PRODUCT DETAILS -->
                <div class="product-info">

                    <span class="collection-label">
                        NEW ARRIVAL
                    </span>


                    <!-- PRODUCT NAME -->
                    <h1 class="product-title">
                        Do Good Work Tee
                    </h1>


                    <!-- PRICE -->
                    <p class="product-price">
                        ₱499.00
                    </p>


                    <!-- DESCRIPTION -->
                    <p class="product-description">
                        A clean everyday staple with a subtle blue
                        detail and a comfortable fit. Made for
                        everyday movement and effortless styling.
                    </p>


                    <hr class="product-divider">


                    <!-- SIZE SELECTION -->
                    <p class="size-label">
                        Size: <strong id="selectedSize">S</strong>
                    </p>

                    <div class="size-options" aria-label="Choose a size">

                        <button type="button"
                                class="size-btn selected"
                                data-size="S">S</button>

                        <button type="button"
                                class="size-btn"
                                data-size="M">M</button>

                        <button type="button"
                                class="size-btn"
                                data-size="L">L</button>

                        <button type="button"
                                class="size-btn"
                                data-size="XL">XL</button>

                    </div>



                    <!-- QUANTITY SELECTION -->
                    <div class="quantity-row">

                        <span>Quantity:</span>

                        <button type="button"
                                class="quantity-btn"
                                id="decreaseQty"
                                aria-label="Decrease quantity">
                            −
                        </button>

                        <output id="quantity" aria-live="polite">1</output>

                        <button type="button"
                                class="quantity-btn"
                                id="increaseQty"
                                aria-label="Increase quantity">
                            +
                        </button>

                    </div>



                    <!-- BUY NOW -->
                    <button type="button"
                            class="buy-button"
                            id="buyNow">

                        Buy Now

                    </button>


                    <!-- FEEDBACK MESSAGE -->
                    <p class="status-message"
                       id="statusMessage"
                       role="status"
                       aria-live="polite"></p>

                </div>

            </section>

        </div>

    </main>



    <!-- FOOTER -->

    <footer class="product-footer">

        <div class="product-footer-content">

            <p>Via Roma © 2026</p>

            <a href="privacy.html">
                Privacy Policy
            </a>

        </div>

    </footer>

</body>

</html>
